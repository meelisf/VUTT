# NB! Aktiivne konfiguratsioon asub serveris: /etc/nginx/sites-available/vutt
# Muudatuste rakendamiseks kopeeri see fail sinna ja tee: sudo systemctl reload nginx
# Eeldab hosti /etc/nginx/nginx.conf http{} blokis rate-limit tsoone:
#   limit_req_zone $binary_remote_addr zone=vutt_auth:10m rate=1r/s;
#   limit_req_zone $binary_remote_addr zone=vutt_api:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=vutt_meili:10m rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=vutt_images:10m rate=60r/s;
#   limit_req_status 429;
#
# Eeldab ka brotli mooduleid (Ubuntu: libnginx-mod-http-brotli-filter,
# libnginx-mod-http-brotli-static) — vt /etc/nginx/modules-enabled/.

# Tuvasta sotsiaalmeedia robotid                                                                                                                        
map $http_user_agent $is_bot {                                                                                                                          
    default 0;
    ~*(facebookexternalhit|twitterbot|Bluesky|whatsapp|telegrambot|linkedinbot|embedly|quora\ link\
preview|showyoubot|outbrain|slackbot|discordbot|mastodon|pinterest\/0\.|bingbot|googlebot) 1;
}

server {
    listen 80;
    server_name vutt.utlib.ut.ee;
    # Suuna kõik HTTPS-ile
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vutt.utlib.ut.ee;

    # SSL Sertifikaadid (eeldatud asukoht host-masinas)
    ssl_certificate /etc/nginx/certs/vutt/vutt_utlib_ut_ee_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/vutt/vutt_utlib_ut_ee.key;

    # Turvalisus: TLS protokollid
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Turvalisus: HTTP päised (Security Headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

    add_header X-Content-Type-Options "nosniff" always;
    more_set_headers "X-Content-Type-Options: nosniff";

    add_header X-Frame-Options "SAMEORIGIN" always; # Kaitse clickjacking vastu
    more_set_headers "X-Frame-Options: SAMEORIGIN";

    add_header X-XSS-Protection "1; mode=block" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.openhistoricalmap.org; connect-src 'self' https://www.wikidata.org https://viaf.org https://lobid.org https://services.dnb.de https://*.openhistoricalmap.org; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self';" always;
    more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.openhistoricalmap.org; connect-src 'self' https://www.wikidata.org https://viaf.org https://lobid.org https://services.dnb.de https://*.openhistoricalmap.org; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self';";

    # Jõudlus: Gzip pakkimine
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Jõudlus: Brotli (gzip jääb alles klientidele, kes br-i ei toeta).
    # Sama MIME-tüüpide komplekt mis gzip'il. Tase 5 on brotli mõistlik
    # kompromiss lennult pakkimisel (11 on arhiveerimiseks, mitte serveerimiseks).
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Staatilised varad on build'i ajal ette pakitud (scripts/precompress-dist.mjs,
    # brotli tase 11) — nginx serveerib .br/.gz kõrvalfaili ega paki iga päringu
    # peal uuesti. Mõõdetud: ette pakitud br-11 võidab gzip-6 ees 15%, lennult
    # br-5 ainult 6%. Lennult pakkimine jääb alles dünaamilistele vastustele
    # (Meili otsingutulemused: 2185 B → 967 B).
    brotli_static on;
    gzip_static on;
    
    # Logid
    access_log /var/log/nginx/vutt_access.log;
    error_log /var/log/nginx/vutt_error.log;

    # Frontend (React) - asub kasutaja kodukataloogis
    root /home/meelisf/VUTT/dist;
    index index.html;

    # Sotsiaalmeedia robotitele dünaamilised metaandmed
    location /work/ {
      if ($is_bot) {
          rewrite ^/work/([^/]+)/?.*$ /api/files/meta/work/$1 last;
      }
      try_files $uri $uri/ /index.html;
    }

    location /persons {
      if ($is_bot) {
          rewrite ^/persons/?$ /api/files/meta/persons last;
          rewrite ^/persons/([^/]+)/?.*$ /api/files/meta/person/$1 last;
      }
      try_files $uri $uri/ /index.html;
    }

    # Staatilised varad (assets) - pikem cache kuna failinimed sisaldavad hashi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off; # Vähendab logimüra
    }

    # Sitemap: proovi staatilist faili, muidu proxi backendi (dünaamiline XML).
    # Exact-match, et mitte langeda location / SPA-fallbacki (index.html).
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8002/sitemap.xml;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # Bot-koduleht: linkgraafi jaotuspunkt (botid saavad serveripoolse indeksi
    # teostest+isikutest; brauserid saavad SPA shelli). Exact-match → enne location /.
    location = / {
        if ($is_bot) {
            rewrite ^/$ /api/files/meta/home last;
        }
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Kõik muud päringud (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        # HTML failidele ära cache'i, et uuendused jõuaksid kohe kohale
        add_header Cache-Control "no-cache";
    }

    # API: Sisselogimine ja registreerimine (range piirang: 1 rps)
    location ~ ^/api/files/(login|register|invite/set-password)$ {
        proxy_pass http://127.0.0.1:8002/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        limit_req zone=vutt_auth burst=5 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API: Admin endpointid — rate limit puudub (upload, reocr jms admin tööriistad)
    location /api/files/admin/ {
        proxy_pass http://127.0.0.1:8002/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 600M;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Bot-prerender: avalik, cache'itud ja ilma IP-põhise API limiidita.
    # Google kontrollib sitemap'i URL-e lühikeste suurte lainetena; ülikooli
    # pöördproksi taga paistavad need päringud nginxile sama lähte-IP-na.
    location /api/files/meta/ {
        proxy_pass http://127.0.0.1:8002/meta/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache";
    }

    # API: Üldised andmed (piirang: 10 rps)
    location /api/files/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 600M;

        limit_req zone=vutt_api burst=20 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API - pildid (Image Server - Port 8001)
    location /api/images/ {
        # Oma tsoon, MITTE vutt_api: dashboard laeb korraga 12+ pisipilti ja
        # töölaud eellaeb kõrvallehti. Ühises tsoonis sõid pildipäringud API
        # tokenid ära ja viewer-token/meili-token said 429 (vt #177).
        limit_req zone=vutt_images burst=100 nodelay;

        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        
        # Pildid ei muutu, hoia cache'is kaua (30 päeva)
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Meilisearch (Port 7700)
    location /meili/ {
        limit_req zone=vutt_meili burst=50 nodelay;

        proxy_pass http://127.0.0.1:7700/;
        proxy_set_header Host $host;
        # Oluline Meilisearchi jaoks, et Authorization header läbi tuleks
        proxy_set_header Authorization $http_authorization; 
    }

    # Umami Analytics - Data Collection (Public)
    # Admin panel is kept private (access via SSH tunnel to port 3000)
    location = /umami.js {
        proxy_pass http://127.0.0.1:3000/script.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/send {
        proxy_pass http://127.0.0.1:3000/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
