# Docker json-file logide rotatsioon (muidu kasvavad piiramatult).
# Iga konteiner: max 10MB × 5 faili = ~50MB. NB: rakendub konteineri
# (taas)loomisel — `docker compose up -d` (mitte ainult restart).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Backend: Python serverid (File Server + Image Server)
  backend:
    build: .
    container_name: vutt-backend
    restart: always
    logging: *default-logging
    environment:
      # VUTT_ENV=production aktiveerib startup-kontrolli vaikimisi saladuste vastu (Leid 1).
      # Sea .env failis VUTT_ENV=production tootmises; arenduses jäta määramata (dev).
      - VUTT_ENV=${VUTT_ENV:-dev}
      - VUTT_DATA_DIR=/data
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-vutt_master_key}
      - MEILI_SEARCH_KEY=${MEILI_SEARCH_KEY:-}
      - MEILI_SEARCH_KEY_UID=${MEILI_SEARCH_KEY_UID:-}
      - IMAGE_TOKEN_SECRET=${IMAGE_TOKEN_SECRET:-dev-image-secret-change-in-production}
      - UPLOAD_ENABLED=${UPLOAD_ENABLED:-false}
      - OCR_SERVER_HOST=${OCR_SERVER_HOST:-172.17.120.146}
      - OCR_SERVER_USER=${OCR_SERVER_USER:-mf}
      - OCR_SERVER_PATH=${OCR_SERVER_PATH:-/home/mf/Dokumendid/LLM}
      # Gemini (teine OCR-pakkuja). Compose loetleb muutujad NIMELISELT —
      # ainult `.env`-i lisamine ei jõuaks konteinerisse ja funktsioon oleks
      # vaikselt väljas, ilma ühegi veateateta.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Mudelinimi vananeb kiiresti: vaikeväärtus elab AINULT `server/config.py`-s.
      # Siin tühi = `env()` kohtleb tühja stringi puuduvana ja langeb sinna tagasi;
      # duplikaat-vaikeväärtus siin võitis vaikselt koodi oma (mõõdetud 2026-09-02).
      - GEMINI_OCR_MODEL=${GEMINI_OCR_MODEL:-}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-low}
      - GEMINI_MAX_INFLIGHT_REQUESTS=${GEMINI_MAX_INFLIGHT_REQUESTS:-4}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_REQUEST_TIMEOUT=${GEMINI_REQUEST_TIMEOUT:-120}
      - GEMINI_MAX_REQUEST_BYTES=${GEMINI_MAX_REQUEST_BYTES:-15728640}
      - GEMINI_MAX_PROMPT_BYTES=${GEMINI_MAX_PROMPT_BYTES:-8192}
      - GEMINI_MAX_FEW_SHOT=${GEMINI_MAX_FEW_SHOT:-3}
      # Kirjade saatmine (#298, ADR 0034). Kanal: konteiner → hosti postfix →
      # mailhost.ut.ee. Autentimist ei ole, seega siin ei ole saladusi.
      # Väärtused tulevad `.env`-ist; TÜHI = saatmine välja lülitatud ja
      # vaikeväärtus elab AINULT `server/config.py`-s (duplikaat siin võidaks
      # vaikselt koodi oma — mõõdetud GEMINI_OCR_MODEL-i puhul 2026-09-02).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
    # Hosti postfix (relayhost = mailhost.ut.ee). Konteineri „localhost" on
    # konteiner ise, seega tuleb hosti aadress Dockerilt.
    #
    # `host-gateway` osutab docker0-le (mõõdetud: 192.168.200.1), MITTE selle
    # compose-võrgu gateway'le — see on ainult siht-aadress. Relay-luba otsustab
    # postfix hoopis KLIENDI aadressi järgi (mõõdetud: 192.168.201.4), mis peab
    # olema hosti `mynetworks`-is. Seepärast on allpool fikseeritud just
    # alamvõrk, mitte gateway.
    extra_hosts:
      - "smtp-relay:host-gateway"
    volumes:
      # Mountime andmed hostilt konteinerisse
      - ./data:/data
      # Mountime olekufailid (kasutajad, tokenid jms)
      - ./state:/app/state
      # Upload staging kaust
      - ./uploads:/app/uploads
      # SSH võti OCR serverisse ühendumiseks (read-only)
      - ~/.ssh:/root/.ssh:ro
      # Album Academicum referentsandmed (read-only)
      - ./reference_data:/app/reference_data:ro
    # Pordid suletud välismaailmale (ainult sisevõrk või nginx kasutab)
    # Avame localhostile host Nginxi jaoks
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"

  # Otsingumootor
  meilisearch:
    image: getmeili/meilisearch:v1
    container_name: vutt-meili
    restart: always
    logging: *default-logging
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-vutt_master_key}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    # Avame localhostile host Nginxi jaoks
    ports:
      - "127.0.0.1:7700:7700"

  # Umami Analytics Database
  db-umami:
    image: postgres:15-alpine
    container_name: vutt-umami-db
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-vutt_umami_db_pass}
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  # Umami Analytics App
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: vutt-umami
    restart: always
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-vutt_umami_db_pass}@db-umami:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-vutt_umami_secret_key_change_me}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db-umami

  # Frontend ja Reverse Proxy (Host Nginx tegeleb sellega nüüd)
  # nginx:
  #   image: nginx:alpine
  #   container_name: vutt-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./dist:/usr/share/nginx/html:ro
  #   depends_on:
  #     - backend
  #     - meilisearch

volumes:
  meili_data:
  umami_db_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        # FIKSEERITUD, mitte Dockeri poolist võetud: sama vahemik on hosti
        # postfixi `mynetworks`-is (ADR 0034). Kui see siin muutuks, keelduks
        # relee konteineri kirjadest — 554 Relay access denied, ilma et
        # kummalgi pool midagi oleks „katki".
        - subnet: 192.168.201.0/24