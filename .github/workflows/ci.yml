name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e mcp/

      - name: Run backend tests
        env:
          VUTT_ENV: dev
          MEILI_URL: http://127.0.0.1:7700
          MEILI_MASTER_KEY: ci-meili-master-key
          IMAGE_TOKEN_SECRET: ci-image-token-secret
        run: pytest tests/ mcp/tests/

  frontend:
    name: Frontend typecheck/test/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Baseline-lävi: olemasolevad hoiatused on lubatud, uued mitte.
      # Kui parandad mõne, langeta arvu package.json-is (lint:ci).
      - name: Lint (React Hooks)
        run: npm run lint:ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
